requires:
  min-version: 8

pcap: ../../output-eve-tftp-01/input.pcap

args:
  - --simulate-ips
  - -k none

checks:
# UDP packets accepted by the packet hook
- filter:
    count: 99
    match:
      event_type: alert
      alert.signature_id: 1000
      alert.engine: fw
# TFTP request transaction accepted by the app-layer hook
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 2000
      alert.engine: fw
      app_proto: tftp
# TFTP request completion hook
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 2002
      alert.engine: fw
      app_proto: tftp
- filter:
    requires:
      lt-version: 9
    count: 1
    match:
      event_type: stats
      stats.ips.accepted: 99
      stats.ips.blocked: 0
- filter:
    requires:
      min-version: 9
    count: 1
    match:
      event_type: stats
      stats.firewall.accepted: 99
      stats.firewall.blocked: 0
      stats.firewall.drop_reason.rules: 0
      stats.firewall.drop_reason.default_app_policy: 0
