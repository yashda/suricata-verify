requires:
  min-version: 8

pcap: ../../dhcp-eve-extended/input.pcap

args:
  - --simulate-ips
  - -k none

checks:
# UDP packets accepted by the packet hook
- filter:
    count: 2
    match:
      event_type: alert
      alert.signature_id: 1000
      alert.engine: fw
# DHCP request transaction accepted by the app-layer hook
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 2000
      alert.engine: fw
      app_proto: dhcp
# DHCP response transaction accepted by the app-layer hook
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 2001
      alert.engine: fw
      app_proto: dhcp
# DHCP request completion hook
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 2002
      alert.engine: fw
      app_proto: dhcp
- filter:
    requires:
      lt-version: 9
    count: 1
    match:
      event_type: stats
      stats.ips.accepted: 1
      stats.ips.blocked: 0
- filter:
    requires:
      min-version: 9
    count: 1
    match:
      event_type: stats
      stats.firewall.accepted: 1
      stats.firewall.blocked: 1
      stats.firewall.drop_reason.rules: 0
      stats.firewall.drop_reason.default_app_policy: 1
