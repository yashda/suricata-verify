requires:
  min-version: 8

pcap: ../../pgsql/pgsql-5000-query-results/input.pcap

args:
  - --simulate-ips
  - -k none

checks:
# TCP packets accepted by the packet hook
- filter:
    count: 8
    match:
      event_type: alert
      alert.signature_id: 1000
      alert.engine: fw
# PGSQL request transaction accepted by the app-layer hook
- filter:
    count: 2
    match:
      event_type: alert
      alert.signature_id: 2000
      alert.engine: fw
      app_proto: pgsql
- filter:
    requires:
      lt-version: 9
    count: 1
    match:
      event_type: stats
      stats.ips.accepted: 6
      stats.ips.blocked: 0
- filter:
    requires:
      min-version: 9
    count: 1
    match:
      event_type: stats
      stats.firewall.accepted: 6
      stats.firewall.blocked: 779
      stats.firewall.drop_reason.rules: 0
      stats.firewall.drop_reason.default_app_policy: 2
