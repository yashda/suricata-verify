requires:
  min-version: 8

pcap: ../../dcerpc/dcerpc-dce-stub-data-02/input.pcap

args:
  - --simulate-ips
  - -k none

checks:
# TCP packets accepted by the packet hook
- filter:
    count: 9
    match:
      event_type: alert
      alert.signature_id: 1000
      alert.engine: fw
# DCERPC request transaction accepted by the app-layer hook
- filter:
    count: 2
    match:
      event_type: alert
      alert.signature_id: 2000
      alert.engine: fw
      app_proto: dcerpc
# DCERPC request completion hook
- filter:
    count: 2
    match:
      event_type: alert
      alert.signature_id: 2002
      alert.engine: fw
      app_proto: dcerpc
- filter:
    requires:
      lt-version: 9
    count: 1
    match:
      event_type: stats
      stats.ips.accepted: 9
      stats.ips.blocked: 0
- filter:
    requires:
      min-version: 9
    count: 1
    match:
      event_type: stats
      stats.firewall.accepted: 9
      stats.firewall.blocked: 0
      stats.firewall.drop_reason.rules: 0
      stats.firewall.drop_reason.default_app_policy: 0
